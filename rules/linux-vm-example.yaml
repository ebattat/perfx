# Linux VM Recommended Configuration
# Source: https://github.com/redhat-performance/benchmark-runner/blob/main/benchmark_runner/common/template_operations/templates/linux/internal_data
# Reference: https://developers.redhat.com/blog/2026/05/06/best-practice-configuration-and-tuning-linux-and-windows-vms#vm_definition
# Reference: https://developers.redhat.com/blog/2025/06/23/feature-introduction-multiple-iothreads-openshift-virtualization
# Use this as the reference when checking a customer Linux VM configuration.

apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: <set>
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt-vm: <set>
    spec:
      evictionStrategy: LiveMigrate     # ensures VM is live migrated on node drain
      domain:
        cpu:
          sockets: 1
          cores: <set>
        ioThreadsPolicy: supplementalPool       # OCP 4.19+ — offloads IO from vCPU threads
        ioThreads:
          supplementalPoolThreadCount: <set>    # depends on vCPU count — start at 4, scale up for fast storage
                                                # Reference: https://developers.redhat.com/blog/2025/06/23/feature-introduction-multiple-iothreads-openshift-virtualization
        devices:
          blockMultiQueue: true                 # enables multi-queue for block devices (OCP 4.19+)
          networkInterfaceMultiqueue: true
          disks:
          - disk:
              bus: virtio                       # virtio = best performance, NEVER use sata
            name: containerdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            model: virtio                       # NEVER use model: e1000 or e1000e
            name: default
        machine:
          type: <set>
        resources:
          requests:
            memory: <set>
            cpu: <set>
          limits:
            memory: <set>                       # limits must match requests for guaranteed QoS
            cpu: <set>
      terminationGracePeriodSeconds: 180
