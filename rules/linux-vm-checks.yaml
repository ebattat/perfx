# Linux VM Required Configuration Checks
# Source: https://developers.redhat.com/blog/2026/05/06/best-practice-configuration-and-tuning-linux-and-windows-vms#vm_definition
# Reference: https://developers.redhat.com/blog/2025/06/23/feature-introduction-multiple-iothreads-openshift-virtualization

devices:
  disk:
    bus: virtio                         # virtio = best performance, NEVER use sata

cpu:
  sockets: 1                            # set all vCPUs in cores, not sockets — sockets: 1, threads: 1
  threads: 1

evictionStrategy: LiveMigrate           # optional — WARNING if missing; ensures VM is live migrated on node drain

ioThreadsPolicy: supplementalPool       # OCP 4.19+ — offloads IO from vCPU threads
ioThreads:
  supplementalPoolThreadCount: required # must be set; value depends on vCPU count (start at 4)
