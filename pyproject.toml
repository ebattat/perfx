[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfx"
version = "0.1.0"
description = "Gemini/Claude agent for GitHub, Jira, and log analysis"
requires-python = ">=3.10"
dependencies = [
    "anthropic[vertex]>=0.40.0",
    "google-genai>=0.8.0",
    "PyGithub>=2.3.0",
    "jira>=3.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[project.scripts]
perfx = "perfx.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["perfx*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert used in tests
