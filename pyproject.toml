[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfbot"
version = "0.1.0"
description = "Gemini-powered CLI agent for GitHub and Jira"
requires-python = ">=3.10"
dependencies = [
    "google-generativeai>=0.7.0",
    "PyGithub>=2.3.0",
    "jira>=3.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
perfbot = "perfbot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["perfbot*"]
